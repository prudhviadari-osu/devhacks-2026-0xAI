<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#010a13" />
<title>Support Bot — Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --void:#010a13; --deep:#06121c; --panel:#0a1621; --panel2:#0f1f2c;
    --gold:#c8aa6e; --gold-hi:#f0e6d2; --gold-dim:#785a28; --gold-deep:#463714;
    --teal:#0ac8b9; --teal-dim:#0a5c5a;
    --text:#f0e6d2; --muted:#a09b8c; --faint:#5b5a56;
    --ally:#2fa8ff; --ally-hi:#8fd0ff; --ally-soft:rgba(47,168,255,.12);
    --enemy:#e84057; --enemy-hi:#ff9aa8; --enemy-soft:rgba(232,64,87,.12);
    --hp:#3fbf4f; --mana:#3a8fe8;
    --display:"Cinzel", "Times New Roman", serif;
    --ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(10,200,185,.07), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(200,170,110,.06), transparent 60%),
      var(--void);
    color:var(--text); font:13px/1.45 var(--ui);
    display:flex; height:100vh; height:100dvh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ---------- gold-trim frame helper ---------- */
  .frame { position:relative; border:1px solid var(--gold-dim);
           background:linear-gradient(180deg,var(--panel2),var(--panel));
           box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(240,230,210,.04); }

  /* ---------- top bar ---------- */
  #topbar {
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:10px 18px;
    background:linear-gradient(180deg,#0b1a26,#050f18);
    border-bottom:1px solid var(--gold-dim);
    box-shadow:0 1px 0 var(--gold-deep), 0 8px 24px rgba(0,0,0,.5);
    position:relative; z-index:3;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .crest { width:30px; height:30px; flex:none; }
  #topbar h1 {
    font-family:var(--display); font-weight:900; font-size:17px; letter-spacing:.14em;
    background:linear-gradient(180deg,var(--gold-hi) 10%,var(--gold) 55%,#8a6a30);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    white-space:nowrap;
  }
  #topbar h1 small { display:block; font-family:var(--ui); font-size:9.5px; font-weight:600;
    letter-spacing:.22em; -webkit-text-fill-color:var(--muted); color:var(--muted);
    text-transform:uppercase; margin-top:1px; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  label { color:var(--muted); font-size:10px; display:flex; gap:7px; align-items:center;
          text-transform:uppercase; letter-spacing:.16em; font-weight:700; }
  select, button {
    font:600 11.5px var(--ui); letter-spacing:.08em; text-transform:uppercase;
    color:var(--gold-hi); cursor:pointer;
    background:linear-gradient(180deg,#1e2328,#0f1418);
    border:1px solid var(--gold-dim); border-radius:2px; padding:7px 14px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 1px 0 rgba(240,230,210,.06);
    transition:border-color .15s, color .15s, box-shadow .15s, transform .05s;
  }
  select { -webkit-appearance:none; appearance:none; padding-right:28px;
    background:
      linear-gradient(45deg,transparent 50%,var(--gold) 50%) right 13px center/5px 5px no-repeat,
      linear-gradient(-45deg,transparent 50%,var(--gold) 50%) right 9px center/5px 5px no-repeat,
      linear-gradient(180deg,#1e2328,#0f1418); }
  select option { background:#0a1621; color:var(--text); }
  select:hover, button:hover { border-color:var(--gold); color:#fff;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), 0 0 12px rgba(200,170,110,.25); }
  button:active { transform:translateY(1px); }
  #camBtn { color:var(--teal); border-color:var(--teal-dim); }
  #camBtn:hover { border-color:var(--teal); box-shadow:0 0 12px rgba(10,200,185,.3); }
  select:focus-visible, button:focus-visible { outline:1px solid var(--gold-hi); outline-offset:2px; }
  #desc { color:var(--muted); font-size:12px; margin-left:auto; font-style:italic;
          max-width:44ch; text-align:right; }

  /* ---------- scoreboard ---------- */
  #scorebar {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px;
    padding:8px 24px 10px;
    background:linear-gradient(180deg,rgba(1,10,19,.96),rgba(6,18,28,.96));
    border-bottom:1px solid var(--gold-deep);
    position:relative; z-index:2;
  }
  .team { display:flex; align-items:center; gap:16px; }
  .team.ally { justify-content:flex-end; }
  .team .kda { font:800 20px var(--ui); letter-spacing:.06em; font-variant-numeric:tabular-nums;
               padding:3px 14px; border:1px solid; clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%); }
  .ally .kda { color:var(--ally-hi); background:linear-gradient(90deg,transparent,var(--ally-soft)); border-color:rgba(47,168,255,.4); }
  .enemy .kda { color:var(--enemy-hi); background:linear-gradient(-90deg,transparent,var(--enemy-soft)); border-color:rgba(232,64,87,.4); }
  .team .stat { font-size:9px; color:var(--muted); display:flex; flex-direction:column;
                align-items:center; line-height:1.4; text-transform:uppercase; letter-spacing:.16em; font-weight:700; }
  .team .stat b { color:var(--gold-hi); font-size:15px; font-weight:800; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .team .stat b.gld { color:#f2c94c; }
  .team .stat b.drg { color:#ff9a4a; }
  .nexusbar { width:86px; height:7px; background:#05080b; overflow:hidden;
              border:1px solid var(--gold-deep); margin:4px 0 3px; }
  .nexusbar>div { height:100%; transition:width .3s ease; }
  .ally .nexusbar>div { background:linear-gradient(90deg,#1565c0,var(--ally)); box-shadow:0 0 10px var(--ally); }
  .enemy .nexusbar>div { background:linear-gradient(90deg,#a3263a,var(--enemy)); box-shadow:0 0 10px var(--enemy); margin-left:auto; }
  #center { text-align:center; position:relative; padding:2px 26px;
            border:1px solid var(--gold-dim); border-top:none;
            background:linear-gradient(180deg,#050f18,#0b1a26);
            clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,12px 100%); }
  #gametime { font:700 24px var(--display); letter-spacing:.08em; color:var(--gold-hi);
              font-variant-numeric:tabular-nums; text-shadow:0 0 14px rgba(200,170,110,.35); }
  #winner { font:900 12px var(--display); letter-spacing:.22em; text-transform:uppercase; min-height:16px;
            color:#f2c94c; text-shadow:0 0 14px rgba(242,201,76,.6);
            animation:winpulse 1.1s ease-in-out infinite; }
  #winner:empty { animation:none; min-height:0; }
  @keyframes winpulse { 0%,100% { opacity:.7; } 50% { opacity:1; } }

  /* ---------- canvas ---------- */
  #canvasWrap { flex:1; position:relative; min-height:0; overflow:hidden; background:#04100c; }
  canvas#c { display:block; width:100%; height:100%; }
  #canvasWrap::after { content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.75), inset 0 0 0 1px rgba(120,90,40,.5); }
  #status { position:absolute; top:12px; left:14px; z-index:2;
    font:600 10px var(--ui); letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal); background:rgba(1,10,19,.75); padding:5px 10px 5px 22px;
    border:1px solid var(--teal-dim); backdrop-filter:blur(4px); }
  #status::before { content:""; position:absolute; left:9px; top:50%; width:6px; height:6px;
    margin-top:-3px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal);
    animation:live 1.4s ease-in-out infinite; }
  #status.bad { color:var(--enemy-hi); border-color:rgba(232,64,87,.5); }
  #status.bad::before { background:var(--enemy); box-shadow:0 0 8px var(--enemy); }
  @keyframes live { 50% { opacity:.3; } }
  #mmWrap { position:absolute; right:12px; bottom:12px; z-index:2; padding:4px;
    background:#010a13; border:1px solid var(--gold-dim);
    box-shadow:0 0 0 1px #000, 0 8px 24px rgba(0,0,0,.6); }
  #mmWrap::before { content:""; position:absolute; inset:-5px; border:1px solid var(--gold-deep); pointer-events:none; }
  canvas#mm { display:block; width:190px; height:190px; }

  /* ---------- right AI panel ---------- */
  #ai { width:340px; flex:none; display:flex; flex-direction:column;
        background:linear-gradient(180deg,#071520,#030b12);
        border-left:1px solid var(--gold-dim); box-shadow:-1px 0 0 var(--gold-deep); }
  #aiScroll { overflow-y:auto; padding:14px 14px 18px; flex:1;
              scrollbar-width:thin; scrollbar-color:var(--gold-deep) transparent; }
  #ai h2 { font:700 11px var(--display); letter-spacing:.24em; color:var(--gold);
           text-transform:uppercase; margin:2px 0 12px; display:flex; align-items:center; gap:10px; }
  #ai h2::before, #ai h2::after { content:""; height:1px; flex:1;
    background:linear-gradient(90deg,transparent,var(--gold-dim)); }
  #ai h2::after { background:linear-gradient(-90deg,transparent,var(--gold-dim)); }
  .teamhdr { font:700 9.5px var(--ui); letter-spacing:.22em; text-transform:uppercase;
             margin:12px 0 7px; display:flex; align-items:center; gap:8px; }
  .teamhdr.ally { color:var(--ally-hi); } .teamhdr.enemy { color:var(--enemy-hi); }
  .teamhdr::after { content:""; flex:1; height:1px; background:currentColor; opacity:.25; }

  .champ { position:relative; display:grid; grid-template-columns:44px 1fr; gap:4px 10px;
           padding:8px 10px 9px; margin-bottom:6px;
           background:linear-gradient(90deg,rgba(15,31,44,.95),rgba(8,18,27,.95));
           border:1px solid #1e2d38; transition:border-color .15s, box-shadow .15s; }
  .champ::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; }
  .champ.ally::before { background:var(--ally); box-shadow:0 0 8px var(--ally); }
  .champ.enemy::before { background:var(--enemy); box-shadow:0 0 8px var(--enemy); }
  .champ:hover { border-color:var(--gold-dim); box-shadow:0 0 16px rgba(200,170,110,.12); }
  .champ.dead { filter:grayscale(.9) brightness(.7); }
  .portrait { grid-row:1 / span 3; width:44px; height:44px; position:relative;
              border:2px solid var(--gold-dim); border-radius:50%;
              display:grid; place-items:center;
              font:900 16px var(--display); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8);
              box-shadow:0 0 0 1px #000, inset 0 0 10px rgba(0,0,0,.6); }
  .portrait .lv { position:absolute; bottom:-5px; right:-5px; min-width:18px; height:18px;
                  border-radius:50%; background:#010a13; border:1px solid var(--gold);
                  font:700 9.5px var(--ui); color:var(--gold-hi); display:grid; place-items:center; text-shadow:none; }
  .champ .row1 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .champ .nm { font:700 13.5px var(--display); letter-spacing:.06em; color:var(--gold-hi); }
  .champ .role { font:600 9px var(--ui); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-left:6px; }
  .champ .kda2 { font:700 11px var(--ui); color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .champ .kda2.dead { color:var(--enemy-hi); }
  .champ .beh { font-size:11.5px; color:var(--teal); font-weight:600; letter-spacing:.01em;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .champ .beh::before { content:"\25C6  "; font-size:8px; vertical-align:1px; color:var(--gold); }
  .bars { display:flex; flex-direction:column; gap:2px; }
  .hpbar, .mpbar { height:7px; background:#020608; border:1px solid #000; position:relative; overflow:hidden; }
  .mpbar { height:4px; }
  .hpbar>div, .mpbar>div { height:100%; transition:width .2s; }
  .hpbar::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.55) 9px 10px); }
  .mpbar>div { background:linear-gradient(180deg,#6fb5ff,var(--mana)); }
  .champ .meta { grid-column:1 / -1; color:var(--muted); font-size:10px; display:flex; gap:10px;
                 flex-wrap:wrap; align-items:center; font-variant-numeric:tabular-nums; margin-top:2px; }
  .champ .meta b { color:var(--text); font-weight:700; }
  .champ .meta .g { color:#f2c94c; font-weight:700; }
  .items { display:flex; gap:3px; margin-left:auto; }
  .item { width:20px; height:20px; display:grid; place-items:center;
          font:700 8px var(--ui); color:var(--gold-hi);
          background:radial-gradient(circle at 35% 30%,#3a3220,#120f08);
          border:1px solid var(--gold-dim); }
  .learned { grid-column:1 / -1; font-size:10px; }
  .learned.up { color:#7fdc9a; } .learned.dn { color:#e48a96; }

  #feed { margin-top:16px; }
  #feed .ln { color:#c9c2b0; font-size:10.5px; padding:5px 8px; margin-bottom:3px;
              border-left:2px solid var(--gold-deep);
              background:linear-gradient(90deg,rgba(200,170,110,.07),transparent);
              animation:feedin .25s ease-out; }
  #feed .ln:first-child { border-left-color:var(--gold); color:var(--gold-hi); }
  @keyframes feedin { from { opacity:0; transform:translateX(6px); } }

  /* ---------- responsive (phones via the tunnel) ---------- */
  @media (max-width: 900px) {
    body { flex-direction:column; overflow-y:auto; height:auto; min-height:100dvh; }
    #stage { flex:none; }
    #topbar { padding:10px 16px; gap:10px; }
    #desc { margin-left:0; text-align:left; max-width:none; width:100%; font-size:11px; }
    .controls { width:100%; }
    #scorebar { padding:8px 12px; gap:8px; }
    .team { gap:8px; }
    .team .kda { font-size:14px; padding:2px 9px; }
    .team .stat.hide-sm { display:none; }
    .nexusbar { width:44px; }
    #gametime { font-size:18px; }
    #center { padding:2px 14px; }
    #canvasWrap { flex:none; height:62vh; height:62svh; }
    canvas#mm { width:110px; height:110px; }
    #ai { width:auto; border-left:none; border-top:1px solid var(--gold-dim); }
    #aiScroll { overflow:visible; padding:14px 16px 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="topbar">
      <div class="brand">
        <svg class="crest" viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0e6d2"/><stop offset=".6" stop-color="#c8aa6e"/><stop offset="1" stop-color="#785a28"/></linearGradient></defs>
          <path d="M16 1 29 8v9c0 7-6 12-13 14C9 29 3 24 3 17V8z" fill="#06121c" stroke="url(#cg)" stroke-width="1.6"/>
          <path d="M16 7l3.5 6.5L16 25l-3.5-11.5z" fill="url(#cg)"/>
          <circle cx="16" cy="14" r="2" fill="#0ac8b9"/>
        </svg>
        <h1>SUPPORT BOT<small>AI self-play arena</small></h1>
      </div>
      <div class="controls">
        <label>Scenario
          <select id="scenario">
            <option value="balanced">balanced 5v5</option>
            <option value="dive">dive (peel)</option>
            <option value="teamfight">teamfight</option>
            <option value="skirmish">skirmish</option>
            <option value="objective">objective</option>
            <option value="retreat">retreat</option>
            <option value="farm">farm</option>
            <option value="poke">poke</option>
          </select>
        </label>
        <button id="reload">Restart</button>
        <button id="camBtn">camera: action</button>
      </div>
      <span id="desc"></span>
    </div>
    <div id="scorebar">
      <div class="team ally">
        <div class="stat hide-sm"><b class="gld" id="sAllyGold">0</b>gold</div>
        <div class="stat hide-sm"><b class="drg" id="sAllyDrg">0</b>drakes</div>
        <div class="stat"><div class="nexusbar"><div id="sAllyNx" style="width:100%"></div></div>nexus</div>
        <div class="kda" id="sAllyK">0 / 0 / 0</div>
      </div>
      <div id="center">
        <div id="gametime">0:00</div>
        <div id="winner"></div>
      </div>
      <div class="team enemy">
        <div class="kda" id="sEnemyK">0 / 0 / 0</div>
        <div class="stat"><div class="nexusbar"><div id="sEnemyNx" style="width:100%"></div></div>nexus</div>
        <div class="stat hide-sm"><b class="drg" id="sEnemyDrg">0</b>drakes</div>
        <div class="stat hide-sm"><b class="gld" id="sEnemyGold">0</b>gold</div>
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="c"></canvas>
      <div id="status">connecting…</div>
      <div id="mmWrap"><canvas id="mm"></canvas></div>
    </div>
  </div>
  <div id="ai">
    <div id="aiScroll">
      <h2>AI Decisions</h2>
      <div id="champs"></div>
      <div id="feed"><h2>Combat Log</h2><div id="feedlines"></div></div>
    </div>
  </div>
<!-- the ?v query forces the browser to reload the script when it changes,
     so you never get a stale cached renderer. Bump v when you pull updates. -->
<script src="characters.js?v=1"></script>
<script src="renderer.js?v=13"></script>
</body>
</html>
