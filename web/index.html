<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Bot — League-accurate sim</title>
<style>
  :root { --bg:#0a0c12; --panel:#13161f; --panel2:#1b1f2b; --line:#272d3b;
          --text:#eef1f8; --muted:#8891a3; --ally:#4fa8ff; --enemy:#ef5a5a;
          --ally-soft:rgba(79,168,255,.14); --enemy-soft:rgba(239,90,90,.14);
          --dragon:#e0a54a; --gold:#f2c94c; --green:#5fd27a;
          --shadow:0 6px 20px rgba(0,0,0,.45); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:
           radial-gradient(1200px 600px at 20% -10%,rgba(79,168,255,.06),transparent 60%),
           radial-gradient(1200px 600px at 80% 110%,rgba(239,90,90,.06),transparent 60%),
           var(--bg);
         color:var(--text);
         font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* top bar */
  #topbar { display:flex; gap:14px; align-items:center; padding:11px 18px;
            background:linear-gradient(180deg,#1d212d,#12151d);
            border-bottom:1px solid var(--line);
            box-shadow:0 1px 0 rgba(255,255,255,.03) inset, var(--shadow); }
  #topbar h1 { font-size:15px; font-weight:800; letter-spacing:.04em;
               background:linear-gradient(90deg,#6db6ff,#b98cff);
               -webkit-background-clip:text; background-clip:text;
               -webkit-text-fill-color:transparent; }
  #topbar h1 span { color:var(--muted); -webkit-text-fill-color:var(--muted);
                    font-weight:500; font-size:11px; letter-spacing:0; }
  select, button { background:linear-gradient(180deg,#232836,#1a1e29);
            color:var(--text); border:1px solid var(--line); border-radius:8px;
            padding:6px 12px; font:inherit; cursor:pointer;
            transition:background .15s,border-color .15s,transform .05s; }
  select:hover, button:hover { background:linear-gradient(180deg,#2b3140,#20242f);
            border-color:#39414f; }
  button:active { transform:translateY(1px); }
  #camBtn { color:var(--ally); border-color:rgba(79,168,255,.35); }
  label { color:var(--muted); font-size:11px; display:flex; gap:6px;
          align-items:center; text-transform:uppercase; letter-spacing:.06em; }
  #desc { color:var(--muted); font-size:12px; margin-left:auto;
          font-style:italic; }

  /* scoreboard */
  #scorebar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
              gap:24px; padding:12px 28px;
              background:linear-gradient(180deg,#0d1017,#090b10);
              border-bottom:1px solid var(--line);
              box-shadow:var(--shadow); }
  .team { display:flex; align-items:center; gap:18px; }
  .team.ally { justify-content:flex-end; }
  .team .kda { font-size:22px; font-weight:800; letter-spacing:.04em;
               font-variant-numeric:tabular-nums;
               padding:2px 12px; border-radius:9px; }
  .ally .kda { color:var(--ally); background:var(--ally-soft);
               box-shadow:0 0 18px rgba(79,168,255,.18) inset; }
  .enemy .kda { color:var(--enemy); background:var(--enemy-soft);
                box-shadow:0 0 18px rgba(239,90,90,.18) inset; }
  .team .stat { font-size:10px; color:var(--muted); display:flex;
                flex-direction:column; align-items:center; line-height:1.35;
                text-transform:uppercase; letter-spacing:.07em; }
  .team .stat b { color:var(--text); font-size:15px; font-weight:800;
                  letter-spacing:0; font-variant-numeric:tabular-nums; }
  .nexusbar { width:74px; height:8px; background:#20242f; border-radius:5px;
              overflow:hidden; border:1px solid var(--line); margin-bottom:3px; }
  .nexusbar>div { height:100%; transition:width .3s ease; border-radius:5px; }
  .ally .nexusbar>div { background:linear-gradient(90deg,#3f8fe0,#6db6ff);
                        box-shadow:0 0 10px rgba(79,168,255,.6); }
  .enemy .nexusbar>div { background:linear-gradient(90deg,#d84a4a,#ff7a7a);
                         box-shadow:0 0 10px rgba(239,90,90,.6); }
  #center { text-align:center; }
  #gametime { font-size:26px; font-weight:800; letter-spacing:.06em;
              font-variant-numeric:tabular-nums;
              text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #winner { font-size:13px; font-weight:800; letter-spacing:.14em;
            text-transform:uppercase; margin-top:3px; min-height:16px;
            color:var(--gold); text-shadow:0 0 14px rgba(242,201,76,.5);
            animation:winpulse 1.1s ease-in-out infinite; }
  #winner:empty { animation:none; }
  @keyframes winpulse { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  .drg { color:var(--dragon); }

  /* canvas */
  #canvasWrap { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%;
           background:radial-gradient(circle at 50% 45%,#1a1f28,#0b0d12); }
  #status { position:absolute; top:12px; right:16px; font-size:11px;
            color:var(--muted); background:rgba(8,10,16,.6); padding:4px 10px;
            border-radius:7px; border:1px solid var(--line);
            backdrop-filter:blur(4px); letter-spacing:.03em; }
  #status.bad { color:var(--enemy); border-color:rgba(239,90,90,.4); }

  /* right AI panel */
  #ai { width:320px; background:linear-gradient(180deg,#141822,#0f121a);
        border-left:1px solid var(--line); overflow-y:auto; padding:16px; }
  #ai h2 { font-size:11px; letter-spacing:.14em; color:var(--muted);
           text-transform:uppercase; margin-bottom:12px; font-weight:700; }
  .champ { background:linear-gradient(180deg,#1d212d,#171b25);
           border:1px solid var(--line); border-left:3px solid var(--line);
           border-radius:11px; padding:10px 12px; margin-bottom:10px;
           box-shadow:0 2px 8px rgba(0,0,0,.25);
           transition:transform .12s ease,box-shadow .12s ease,border-color .12s; }
  .champ:hover { transform:translateX(-2px);
                 box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .champ.ally { border-left-color:var(--ally); }
  .champ.ally:hover { box-shadow:0 4px 18px rgba(79,168,255,.22); }
  .champ.enemy { border-left-color:var(--enemy); }
  .champ.enemy:hover { box-shadow:0 4px 18px rgba(239,90,90,.22); }
  .champ .row1 { display:flex; justify-content:space-between; align-items:baseline; }
  .champ .nm { font-weight:800; font-size:14px; letter-spacing:.02em; }
  .champ .kda2 { font-size:11px; color:var(--muted);
                 font-variant-numeric:tabular-nums; }
  .champ .beh { font-size:12px; margin-top:5px; color:#cdd3e0; }
  .champ .beh b { color:var(--text); }
  .champ .meta { color:var(--muted); font-size:10.5px; margin-top:5px;
                 display:flex; gap:10px; flex-wrap:wrap; }
  .champ .meta .g { color:var(--gold); font-weight:700; }
  .tag-ALLY { color:var(--ally); } .tag-ENEMY { color:var(--enemy); }
  .hpbar { height:7px; background:#20242f; border-radius:5px; margin-top:7px;
           overflow:hidden; border:1px solid var(--line); }
  .hpbar>div { height:100%; transition:width .2s; border-radius:5px; }
  .items { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
  .item { font-size:9px; background:linear-gradient(180deg,#333a49,#262c38);
          color:#d6dbe6; padding:2px 6px; border-radius:5px;
          border:1px solid #3a4150; letter-spacing:.04em; }
  .learned { font-size:10px; margin-top:4px; }
  #feed { margin-top:16px; }
  #feed .ln { color:#aeb4c2; font-size:10.5px; padding:3px 0;
          border-bottom:1px solid #1a1e27; }
</style>
</head>
<body>
  <div id="stage">
    <div id="topbar">
      <h1>SUPPORT BOT <span>· League-accurate self-play sim</span></h1>
      <label>scenario
        <select id="scenario">
          <option value="balanced">balanced 5v5</option>
          <option value="dive">dive (peel)</option>
          <option value="teamfight">teamfight</option>
          <option value="skirmish">skirmish</option>
          <option value="objective">objective</option>
          <option value="retreat">retreat</option>
          <option value="farm">farm</option>
          <option value="poke">poke</option>
        </select>
      </label>
      <button id="reload">restart</button>
      <button id="camBtn">camera: action</button>
      <span id="desc"></span>
    </div>
    <div id="scorebar">
      <div class="team ally">
        <div class="stat"><b id="sAllyGold">0</b>gold</div>
        <div class="stat"><b class="drg" id="sAllyDrg">0</b>🐉</div>
        <div class="stat"><div class="nexusbar"><div id="sAllyNx" style="width:100%"></div></div>nexus</div>
        <div class="kda" id="sAllyK">0 / 0 / 0</div>
      </div>
      <div id="center">
        <div id="gametime">0:00</div>
        <div id="winner"></div>
      </div>
      <div class="team enemy">
        <div class="kda" id="sEnemyK">0 / 0 / 0</div>
        <div class="stat"><div class="nexusbar"><div id="sEnemyNx" style="width:100%"></div></div>nexus</div>
        <div class="stat"><b class="drg" id="sEnemyDrg">0</b>🐉</div>
        <div class="stat"><b id="sEnemyGold">0</b>gold</div>
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="c"></canvas>
      <div id="status">connecting…</div>
    </div>
  </div>
  <div id="ai">
    <h2>AI decisions</h2>
    <div id="champs"></div>
    <div id="feed"><h2>Combat</h2><div id="feedlines"></div></div>
  </div>
<!-- the ?v query forces the browser to reload the script when it changes,
     so you never get a stale cached renderer. Bump v when you pull updates. -->
<script src="renderer.js?v=6"></script>
</body>
</html>
