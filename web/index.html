<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Bot — League-accurate sim</title>
<style>
  :root { --bg:#0e1016; --panel:#171a22; --panel2:#1e222c; --line:#2b303c;
          --text:#eceef4; --muted:#868c9c; --ally:#4fa8ff; --enemy:#ef5a5a;
          --dragon:#e0a54a; --gold:#f2c94c; --green:#5fd27a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
         font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* top bar */
  #topbar { display:flex; gap:14px; align-items:center; padding:10px 16px;
            background:linear-gradient(180deg,#1b1f29,#14171f);
            border-bottom:1px solid var(--line); }
  #topbar h1 { font-size:15px; font-weight:800; letter-spacing:.02em;
               background:linear-gradient(90deg,#6db6ff,#b98cff);
               -webkit-background-clip:text; background-clip:text;
               -webkit-text-fill-color:transparent; }
  #topbar h1 span { color:var(--muted); -webkit-text-fill-color:var(--muted);
                    font-weight:500; font-size:11px; }
  select, button { background:var(--panel2); color:var(--text);
            border:1px solid var(--line); border-radius:7px; padding:6px 11px;
            font:inherit; cursor:pointer; transition:background .15s; }
  select:hover, button:hover { background:#2a2f3c; }
  label { color:var(--muted); font-size:11px; display:flex; gap:6px;
          align-items:center; }
  #desc { color:var(--muted); font-size:12px; margin-left:auto;
          font-style:italic; }

  /* scoreboard */
  #scorebar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
              gap:20px; padding:10px 24px; background:#0b0d12;
              border-bottom:1px solid var(--line); }
  .team { display:flex; align-items:center; gap:14px; }
  .team.ally { justify-content:flex-end; }
  .team .kda { font-size:18px; font-weight:800; letter-spacing:.03em; }
  .ally .kda { color:var(--ally); } .enemy .kda { color:var(--enemy); }
  .team .stat { font-size:11px; color:var(--muted); display:flex;
                flex-direction:column; align-items:center; line-height:1.3; }
  .team .stat b { color:var(--text); font-size:13px; }
  .nexusbar { width:70px; height:7px; background:#2a2e3a; border-radius:4px;
              overflow:hidden; } .nexusbar>div { height:100%; }
  .ally .nexusbar>div { background:var(--ally); }
  .enemy .nexusbar>div { background:var(--enemy); }
  #center { text-align:center; }
  #gametime { font-size:13px; font-weight:700; }
  #winner { font-size:12px; font-weight:800; color:var(--dragon); margin-top:2px;
            min-height:14px; }
  .drg { color:var(--dragon); }

  /* canvas */
  #canvasWrap { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%;
           background:radial-gradient(circle at 50% 50%,#1a1f28,#0e1016); }
  #status { position:absolute; top:10px; right:14px; font-size:11px;
            color:var(--muted); background:rgba(0,0,0,.4); padding:3px 8px;
            border-radius:6px; }
  #status.bad { color:var(--enemy); }

  /* right AI panel */
  #ai { width:320px; background:var(--panel); border-left:1px solid var(--line);
        overflow-y:auto; padding:14px; }
  #ai h2 { font-size:11px; letter-spacing:.1em; color:var(--muted);
           text-transform:uppercase; margin-bottom:11px; font-weight:700; }
  .champ { background:var(--panel2); border:1px solid var(--line);
           border-left:3px solid var(--line); border-radius:9px;
           padding:9px 11px; margin-bottom:9px; }
  .champ.ally { border-left-color:var(--ally); }
  .champ.enemy { border-left-color:var(--enemy); }
  .champ .row1 { display:flex; justify-content:space-between; align-items:baseline; }
  .champ .nm { font-weight:800; font-size:14px; }
  .champ .kda2 { font-size:11px; color:var(--muted); }
  .champ .beh { font-size:12px; margin-top:4px; color:#cdd3e0; }
  .champ .beh b { color:var(--text); }
  .champ .meta { color:var(--muted); font-size:10.5px; margin-top:4px;
                 display:flex; gap:10px; flex-wrap:wrap; }
  .champ .meta .g { color:var(--gold); }
  .tag-ALLY { color:var(--ally); } .tag-ENEMY { color:var(--enemy); }
  .hpbar { height:6px; background:#2a2e3a; border-radius:4px; margin-top:6px;
           overflow:hidden; } .hpbar>div { height:100%; transition:width .2s; }
  .items { display:flex; gap:3px; margin-top:5px; flex-wrap:wrap; }
  .item { font-size:9px; background:#2d3340; color:#cdd3e0; padding:1px 5px;
          border-radius:4px; border:1px solid #3a4150; }
  .learned { font-size:10px; margin-top:4px; }
  #feed { margin-top:14px; } #feed .ln { color:#aeb4c2; font-size:10.5px;
          padding:1px 0; border-bottom:1px solid #1e222c; }
</style>
</head>
<body>
  <div id="stage">
    <div id="topbar">
      <h1>SUPPORT BOT <span>· League-accurate self-play sim</span></h1>
      <label>scenario
        <select id="scenario">
          <option value="balanced">balanced 5v5</option>
          <option value="dive">dive (peel)</option>
          <option value="teamfight">teamfight</option>
          <option value="skirmish">skirmish</option>
          <option value="objective">objective</option>
          <option value="retreat">retreat</option>
          <option value="farm">farm</option>
          <option value="poke">poke</option>
        </select>
      </label>
      <button id="reload">restart</button>
      <button id="camBtn">camera: action</button>
      <span id="desc"></span>
    </div>
    <div id="scorebar">
      <div class="team ally">
        <div class="stat"><b id="sAllyGold">0</b>gold</div>
        <div class="stat"><b class="drg" id="sAllyDrg">0</b>🐉</div>
        <div class="stat"><div class="nexusbar"><div id="sAllyNx" style="width:100%"></div></div>nexus</div>
        <div class="kda" id="sAllyK">0 / 0 / 0</div>
      </div>
      <div id="center">
        <div id="gametime">0:00</div>
        <div id="winner"></div>
      </div>
      <div class="team enemy">
        <div class="kda" id="sEnemyK">0 / 0 / 0</div>
        <div class="stat"><div class="nexusbar"><div id="sEnemyNx" style="width:100%"></div></div>nexus</div>
        <div class="stat"><b class="drg" id="sEnemyDrg">0</b>🐉</div>
        <div class="stat"><b id="sEnemyGold">0</b>gold</div>
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="c"></canvas>
      <div id="status">connecting…</div>
    </div>
  </div>
  <div id="ai">
    <h2>AI decisions</h2>
    <div id="champs"></div>
    <div id="feed"><h2>Combat</h2><div id="feedlines"></div></div>
  </div>
<!-- the ?v query forces the browser to reload the script when it changes,
     so you never get a stale cached renderer. Bump v when you pull updates. -->
<script src="renderer.js?v=5"></script>
</body>
</html>
