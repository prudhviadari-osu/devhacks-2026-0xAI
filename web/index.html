<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Bot — League-accurate sim</title>
<style>
  :root { --bg:#14161c; --panel:#1b1e27; --line:#2a2e3a; --text:#e8e8ee;
          --muted:#8b90a0; --ally:#4fa8ff; --enemy:#ef5a5a; --dragon:#d49a3c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.4 ui-monospace,
         Menlo,Consolas,monospace; display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar { display:flex; gap:12px; align-items:center; padding:10px 14px;
            background:var(--panel); border-bottom:1px solid var(--line); }
  #topbar h1 { font-size:15px; font-weight:700; }
  select, button { background:#262a36; color:var(--text); border:1px solid
            var(--line); border-radius:6px; padding:5px 9px; font:inherit;
            cursor:pointer; }
  #desc { color:var(--muted); font-size:12px; }
  #scorebar { display:flex; align-items:center; justify-content:center; gap:18px;
              padding:8px; background:#12141a; border-bottom:1px solid var(--line);
              font-size:14px; }
  #scorebar .side { display:flex; gap:10px; align-items:center; }
  #scorebar .ally b { color:var(--ally); } #scorebar .enemy b { color:var(--enemy); }
  #scorebar .nx { color:var(--muted); font-size:12px; } #scorebar .nx i { font-style:normal; color:var(--text); }
  #vs { color:var(--muted); font-size:11px; }
  #winner { color:var(--dragon); font-weight:700; }
  #canvasWrap { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; background:#1a1d24; }
  #status { position:absolute; top:8px; right:12px; font-size:12px;
            color:var(--muted); }
  #status.bad { color:var(--enemy); }
  /* right AI panel */
  #ai { width:300px; background:var(--panel); border-left:1px solid var(--line);
        overflow-y:auto; padding:12px; }
  #ai h2 { font-size:12px; letter-spacing:.08em; color:var(--muted);
           text-transform:uppercase; margin-bottom:10px; }
  .champ { border:1px solid var(--line); border-radius:8px; padding:8px 10px;
           margin-bottom:8px; }
  .champ .row1 { display:flex; justify-content:space-between; align-items:center; }
  .champ .nm { font-weight:700; }
  .champ .beh { color:var(--text); font-size:13px; margin-top:2px; }
  .champ .meta { color:var(--muted); font-size:11px; margin-top:3px; }
  .tag-ALLY { color:var(--ally); } .tag-ENEMY { color:var(--enemy); }
  .hpbar { height:5px; background:#3a3f4c; border-radius:3px; margin-top:5px;
           overflow:hidden; } .hpbar > div { height:100%; background:#5fd27a; }
  #feed { margin-top:12px; } #feed .ln { color:#c3c7d2; font-size:11px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="topbar">
      <h1>Support Bot</h1>
      <label>scenario
        <select id="scenario">
          <option value="balanced">balanced 5v5</option>
          <option value="dive">dive (peel)</option>
          <option value="teamfight">teamfight</option>
          <option value="skirmish">skirmish</option>
          <option value="objective">objective</option>
          <option value="retreat">retreat</option>
          <option value="farm">farm</option>
          <option value="poke">poke</option>
        </select>
      </label>
      <button id="reload">restart</button>
      <button id="camBtn">camera: action</button>
      <span id="desc"></span>
    </div>
    <div id="scorebar">
      <span class="side ally"><b id="sAllyK">0/0/0</b> <span class="nx">nexus <i id="sAllyNx">100%</i></span></span>
      <span id="vs">VS</span>
      <span class="side enemy"><span class="nx">nexus <i id="sEnemyNx">100%</i></span> <b id="sEnemyK">0/0/0</b></span>
      <span id="winner"></span>
    </div>
    <div id="canvasWrap">
      <canvas id="c"></canvas>
      <div id="status">connecting…</div>
    </div>
  </div>
  <div id="ai">
    <h2>AI decisions</h2>
    <div id="champs"></div>
    <div id="feed"><h2>Combat</h2><div id="feedlines"></div></div>
  </div>
<!-- the ?v query forces the browser to reload the script when it changes,
     so you never get a stale cached renderer. Bump v when you pull updates. -->
<script src="renderer.js?v=3"></script>
</body>
</html>
